<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 236" width="300" height="236">
  <!-- Lamington Hotel — Christmas baubles for the festive band, in the
       site's own amber, green and cream. The amber one wears the
       outline of Mount Lamington. -->
  <defs>
    <clipPath id="clip-amber"><circle cx="62" cy="138" r="34"/></clipPath>
    <clipPath id="clip-green"><circle cx="158" cy="180" r="40"/></clipPath>
  </defs>

  <!-- strings -->
  <path d="M62 0V94M158 0V130M242 0V56" fill="none" stroke="#F5E6C5" stroke-width="2"/>

  <!-- amber bauble -->
  <rect x="54" y="92" width="16" height="13" rx="2" fill="#C37F28"/>
  <circle cx="62" cy="138" r="34" fill="#E6AA4E"/>
  <g clip-path="url(#clip-amber)" fill="none" stroke="#114B38" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M24 150H39L46 132L50 142L55 127L61 146L69 150L75 137L80 145L87 150H100"/>
  </g>

  <!-- green bauble -->
  <rect x="149" y="128" width="18" height="14" rx="2" fill="#C37F28"/>
  <circle cx="158" cy="180" r="40" fill="#114B38"/>
  <g clip-path="url(#clip-green)" fill="none" stroke="#F5E6C5" stroke-width="2.2">
    <path d="M114 166Q158 184 202 166M114 192Q158 210 202 192"/>
  </g>
  <g fill="#E6AA4E">
    <circle cx="132" cy="185" r="2.6"/>
    <circle cx="145" cy="188.5" r="2.6"/>
    <circle cx="158" cy="189.5" r="2.6"/>
    <circle cx="171" cy="188.5" r="2.6"/>
    <circle cx="184" cy="185" r="2.6"/>
  </g>

  <!-- cream bauble -->
  <rect x="235" y="54" width="14" height="12" rx="2" fill="#C37F28"/>
  <circle cx="242" cy="91" r="27" fill="#F5E6C5"/>
  <path d="M242 77C242.7 86.5 246 90.3 256 91C246 91.7 242.7 95.5 242 105C241.3 95.5 238 91.7 228 91C238 90.3 241.3 86.5 242 77Z" fill="#A3212B"/>
